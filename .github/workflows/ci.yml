name: Validate compiler and audits
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: interrogation-system-build-receipt
          path: |
            build-receipt.json
            fixtures/**/dist-data/
            fixtures/build-index.json
            dist-data/diagnostics.json
